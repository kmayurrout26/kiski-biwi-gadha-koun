<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17365d"><title>BRAY Score Tracker</title>
<style>
:root{--navy:#17365d;--green:#8ed04f;--pink:#d96ccb;--peach:#f3a77c;--blue:#35b7e6;--bg:#f3f6fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18304f}.wrap{max-width:620px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#17365d,#28588c);color:white;padding:20px 16px;border-radius:22px;text-align:center;box-shadow:0 8px 22px #17365d22}.hero h1{margin:0;font-size:27px;letter-spacing:1px}.hero p{margin:5px 0 0;color:#dce8f7;font-size:12px;letter-spacing:1px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.kpi{background:white;border-radius:14px;padding:10px 5px;text-align:center;box-shadow:0 2px 8px #17365d0d}.kpi small{display:block;font-size:10px;font-weight:800;color:#66758b}.kpi strong{display:block;margin-top:4px;font-size:18px;color:var(--navy)}.section{background:white;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 3px 12px #17365d0d}.section h2{font-size:15px;margin:0 0 12px;color:var(--navy)}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player{border-radius:16px;padding:12px;min-height:105px;color:#17365d}.player label{font-weight:900;font-size:18px;display:block}.total{font-size:31px;font-weight:900;line-height:1.3}.player small{font-size:10px;font-weight:800}.mr{background:var(--green)}.mb{background:var(--pink)}.rs{background:var(--peach)}.ds{background:var(--blue)}.leader{margin-top:10px;border-radius:13px;background:#fff0b3;padding:12px;text-align:center;font-weight:850;color:var(--navy)}.round{display:grid;grid-template-columns:42px repeat(4,minmax(0,1fr));gap:5px;align-items:center;margin:7px 0}.round .rn{font-size:12px;font-weight:800;color:#62718a;text-align:center}.round input{width:100%;min-width:0;border:1px solid #dbe3ef;border-radius:9px;padding:9px 2px;text-align:center;font-size:15px;font-weight:800;background:#f8faff;color:#17365d}.round input:focus{outline:2px solid #4d86c6}.round .head{font-size:11px;font-weight:900;text-align:center;padding:7px 0;border-radius:8px}.round .hMR{background:#d8efc7}.round .hMB{background:#f3d4ef}.round .hRS{background:#fde1d1}.round .hDS{background:#d0effa}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.btn{border:0;border-radius:12px;padding:13px 10px;font-weight:850;font-size:13px;background:var(--navy);color:white}.btn.secondary{background:#e0e9f6;color:var(--navy)}.btn.warn{background:#b42332}.ranking{display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px;margin:5px 0;background:#f6f8fc}.ranknum{width:28px;height:28px;border-radius:50%;background:#e0e9f6;display:grid;place-items:center;font-weight:900}.rankname{font-weight:900;flex:1}.rankscore{font-size:18px;font-weight:900}.history-item{padding:10px;border:1px solid #e0e7f1;border-radius:10px;margin:7px 0;font-size:13px}.history-item button{float:right;border:0;background:#e0e9f6;border-radius:8px;padding:5px 8px;color:var(--navy);font-weight:800}.foot{text-align:center;color:#78869a;font-size:11px;padding:8px}.hidden{display:none!important}
</style></head><body><div class="wrap">
<header class="hero"><h1>BRAY SCOREBOARD</h1><p>ADVANCED SCORE TRACKER · GAME HISTORY</p></header>
<div class="kpis"><div class="kpi"><small>LEADER</small><strong id="kLeader">DS</strong></div><div class="kpi"><small>TOP SCORE</small><strong id="kTop">102</strong></div><div class="kpi"><small>ROUNDS PLAYED</small><strong id="kRounds">7</strong></div></div>
<section class="section"><h2>🏆 Current Scores</h2><div class="players" id="cards"></div><div class="leader" id="leaderLine">🏆 LEADING: DS · 102 POINTS</div></section>
<section class="section"><h2>✍️ Enter Round Scores</h2><div class="round"><div></div><div class="head hMR">MR</div><div class="head hMB">MB</div><div class="head hRS">RS</div><div class="head hDS">DS</div></div><div id="rounds"></div><div class="buttons"><button class="btn secondary" id="addRound">＋ Add Round</button><button class="btn secondary" id="removeRound">－ Remove Last</button></div></section>
<section class="section"><h2>📊 Current Ranking</h2><div id="ranking"></div></section>
<div class="buttons"><button class="btn" id="shareBtn">📸 Share Scoreboard</button><button class="btn secondary" id="newGame">＋ New Game</button><button class="btn secondary" id="historyToggle">🗂 Match History</button><button class="btn warn" id="resetBtn">↻ Reset Current Game</button></div>
<section class="section hidden" id="historyPanel"><h2>🗂 Saved Match History</h2><div id="history"></div></section>
<div class="foot">Scores are saved automatically on this device.</div></div>
<script>
const names=['MR','MB','RS','DS']; const classes=['mr','mb','rs','ds']; const colors=['#8ed04f','#d96ccb','#f3a77c','#35b7e6'];
const initial=[[0,4,0,22],[26,26,0,26],[6,-5,17,3],[-5,7,3,16],[-5,25,1,0],[-5,3,10,13],[0,4,-5,22]];
let state=load()||{gameNo:1,rounds:initial.map(r=>r.slice()),history:[]};
function load(){try{return JSON.parse(localStorage.getItem('brayScoreTracker'))}catch(e){return null}}
function save(){localStorage.setItem('brayScoreTracker',JSON.stringify(state))}
function totals(){return names.map((_,i)=>state.rounds.reduce((s,r)=>s+(Number(r[i])||0),0))}
function render(){const ts=totals(), max=Math.max(...ts), leader=names[ts.indexOf(max)];
 document.getElementById('kLeader').textContent=leader;document.getElementById('kTop').textContent=max;document.getElementById('kRounds').textContent=state.rounds.filter(r=>r.some(v=>v!==''&&v!==null)).length;
 document.getElementById('leaderLine').textContent=`🏆 LEADING: ${leader} · ${max} POINTS`;
 document.getElementById('cards').innerHTML=names.map((n,i)=>`<div class="player ${classes[i]}"><label>${n}</label><div class="total">${ts[i]}</div><small>TOTAL POINTS</small></div>`).join('');
 document.getElementById('rounds').innerHTML=state.rounds.map((r,ri)=>`<div class="round"><div class="rn">R${ri+1}</div>${r.map((v,pi)=>`<input aria-label="Round ${ri+1} ${names[pi]}" type="number" step="1" value="${v===null?'':v}" data-r="${ri}" data-p="${pi}" placeholder="—">`).join('')}</div>`).join('');
 const sorted=names.map((n,i)=>({n,s:ts[i],c:colors[i]})).sort((a,b)=>b.s-a.s);
 document.getElementById('ranking').innerHTML=sorted.map((p,i)=>`<div class="ranking"><div class="ranknum">${i+1}</div><div class="rankname">${p.n}</div><div class="rankscore">${p.s}</div></div>`).join('');
 document.querySelectorAll('#rounds input').forEach(el=>el.addEventListener('change',e=>{const r=+e.target.dataset.r,p=+e.target.dataset.p;state.rounds[r][p]=e.target.value===''?'':Number(e.target.value);save();render();})); renderHistory();
}
function renderHistory(){const h=document.getElementById('history');if(!state.history.length){h.innerHTML='<p>No saved matches yet. Tap New Game to save this game and start another.</p>';return;}h.innerHTML=state.history.slice().reverse().map((g,idx)=>{const realIdx=state.history.length-1-idx;return `<div class="history-item"><button data-load="${realIdx}">Load</button><b>${g.title}</b><br>${g.date}<br>${g.scores.map((s,i)=>`${names[i]}: ${s}`).join(' · ')}</div>`}).join('');h.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const g=state.history[+b.dataset.load];state.rounds=g.rounds.map(r=>r.slice());state.gameNo=g.gameNo;save();render();window.scrollTo({top:0,behavior:'smooth'});});}
document.getElementById('addRound').onclick=()=>{if(state.rounds.length>=18){alert('Maximum 18 rounds reached.');return;}state.rounds.push(['','','','']);save();render();};
document.getElementById('removeRound').onclick=()=>{if(state.rounds.length>1){state.rounds.pop();save();render();}};
document.getElementById('newGame').onclick=()=>{if(!confirm('Save this game to history and start a new blank game?'))return;state.history.push({gameNo:state.gameNo,title:'Game '+state.gameNo,date:new Date().toLocaleString(),rounds:state.rounds.map(r=>r.slice()),scores:totals()});state.gameNo++;state.rounds=Array.from({length:7},()=>['','','','']);save();render();window.scrollTo({top:0,behavior:'smooth'});};
document.getElementById('resetBtn').onclick=()=>{if(confirm('Clear all scores in the current game? Saved history will remain.')){state.rounds=Array.from({length:7},()=>['','','','']);save();render();}};
document.getElementById('historyToggle').onclick=()=>document.getElementById('historyPanel').classList.toggle('hidden');
document.getElementById('shareBtn').onclick=async()=>{const ts=totals(),sorted=names.map((n,i)=>({n,s:ts[i],c:colors[i]})).sort((a,b)=>b.s-a.s);const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1120;const c=canvas.getContext('2d');c.fillStyle='#f3f6fc';c.fillRect(0,0,900,1120);function roundRect(x,y,w,h,r,fill){c.fillStyle=fill;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}roundRect(28,28,844,140,28,'#17365d');c.fillStyle='white';c.font='bold 48px system-ui';c.textAlign='center';c.fillText('BRAY SCOREBOARD',450,88);c.font='bold 22px system-ui';c.fillStyle='#dce8f7';c.fillText('GAME '+state.gameNo+'  •  CURRENT TOTALS',450,128);
 names.forEach((n,i)=>{let x=48+(i%2)*410,y=205+Math.floor(i/2)*170;roundRect(x,y,384,145,22,colors[i]);c.textAlign='left';c.fillStyle='#17365d';c.font='bold 32px system-ui';c.fillText(n,x+24,y+45);c.font='bold 56px system-ui';c.textAlign='right';c.fillText(String(ts[i]),x+350,y+100);c.font='bold 15px system-ui';c.textAlign='left';c.fillText('TOTAL POINTS',x+24,y+119);});
 roundRect(48,565,804,390,24,'white');c.textAlign='center';c.fillStyle='#17365d';c.font='bold 27px system-ui';c.fillText('CURRENT RANKING',450,610);sorted.forEach((p,i)=>{let y=662+i*62;roundRect(78,y-27,744,48,12,i%2?'#ffffff':'#f3f6fc');c.textAlign='left';c.fillStyle='#62718a';c.font='bold 21px system-ui';c.fillText(String(i+1)+'.',102,y+3);c.fillStyle='#17365d';c.font='bold 23px system-ui';c.fillText(p.n,165,y+3);c.textAlign='right';c.font='bold 24px system-ui';c.fillText(String(p.s),790,y+3);});roundRect(48,985,804,88,20,'#e3ebf7');c.textAlign='center';c.fillStyle='#17365d';c.font='bold 23px system-ui';c.fillText('TOTAL SCORE  '+ts.reduce((a,b)=>a+b,0),450,1038);
 const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));const file=new File([blob],'BRAY_Scoreboard.png',{type:'image/png'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'BRAY Scoreboard',text:'Current BRAY game scores',files:[file]});}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BRAY_Scoreboard.png';a.click();alert('Scoreboard image saved. Open it from Downloads and share to WhatsApp.');}}catch(e){if(e.name!=='AbortError'){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BRAY_Scoreboard.png';a.click();}}};
render();
</script></body></html>
